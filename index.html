    <!--
      Fonts are self-hosted from /fonts (see src/styles/fonts.css). Preloading
      the two latin faces the hero paints with means they are requested in the
      first wave rather than after the CSS has been parsed, so the real metrics
      are available at first paint and the layout does not reflow.

      Only latin, and only the faces above the fold: preloading something the
      page does not immediately use just delays what it does.
    -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Runs before first paint so dark-theme visitors never see a white flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          // Private-browsing modes throw on localStorage. Dark is the design default.
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
